name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          # Build-time placeholders. Every DB-touching route is force-dynamic,
          # so no database is contacted during `next build`.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          SESSION_SECRET: ci-placeholder-secret-value-at-least-32-characters-long
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: desco-attendance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
